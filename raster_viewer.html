<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Raster Viewer — pipeline GeoTIFFs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#10130e;--panel:#181c15;--ink:#e7ebe1;--soft:#9aa593;--line:#2b3227;--accent:#63b487;}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{display:flex;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  #side{width:330px;min-width:330px;overflow:auto;border-right:1px solid var(--line);padding:14px;background:var(--panel)}
  #map{flex:1}
  h1{font-size:15px;margin:0 0 2px} .sub{color:var(--soft);font-size:11px;margin:0 0 12px}
  .btn{display:block;width:100%;text-align:center;background:var(--accent);color:#08130c;font-weight:600;
       border:0;border-radius:8px;padding:9px;cursor:pointer;font-size:13px;margin-bottom:6px}
  .hint{color:var(--soft);font-size:10.5px;line-height:1.4;margin:0 0 12px}
  .lyr{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:9px;background:#12160f}
  .lyr h3{font-size:12px;margin:0 0 6px;word-break:break-all}
  .row{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:11px}
  .row label{color:var(--soft);width:56px;flex:none}
  select,input{background:#0c0f09;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:11px;flex:1;min-width:0}
  input[type=range]{padding:0}
  .leg{height:11px;border-radius:3px;margin-top:6px}
  .legval{display:flex;justify-content:space-between;color:var(--soft);font-size:10px;margin-top:2px}
  .x{background:none;border:0;color:var(--soft);cursor:pointer;float:right;font-size:12px}
  #val{position:absolute;z-index:1000;left:346px;top:10px;background:var(--panel);border:1px solid var(--line);
       border-radius:6px;padding:5px 9px;font-size:12px;pointer-events:none;opacity:0}
  a{color:var(--accent)}
</style>
</head>
<body>
<div id="side">
  <h1>Raster Viewer</h1>
  <p class="sub">pipeline GeoTIFFs · client-side · no upload</p>
  <button class="btn" onclick="fi.click()">＋ Load GeoTIFF(s)…</button>
  <input id="fi" type="file" accept=".tif,.tiff" multiple style="display:none"/>
  <p class="hint">Pick the <b>.tif</b> from your Google-Drive folder (File-Stream synced, or downloaded).
     Everything renders in your browser — nothing is uploaded. Multi-band products (CPI=11, stage=6)
     get a <b>band</b> selector. Click the map to read a pixel value.</p>
  <div id="layers"></div>
</div>
<div id="map"></div>
<div id="val"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"></script>
<script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>
<script>
// ---- palettes (match the pipeline apps) ----
const PALS = {
  "RdYlGn (CPI/WRSI)": ["#a50026","#d73027","#f46d43","#fdae61","#fee08b","#ffffbf","#d9ef8b","#a6d96a","#66bd63","#1a9850","#006837"],
  "Reds (stress/failure)": ["#ffffff","#fee5d9","#fcae91","#fb6a4a","#de2d26","#a50f15"],
  "Blues (waterlog/WHC)": ["#f7fbff","#deebf7","#c6dbef","#9ecae1","#6baed6","#3182bd","#08519c"],
  "BrBG (SPI −/+)": ["#8c510a","#bf812d","#dfc27d","#f6e8c3","#f5f5f5","#c7eae5","#80cdc1","#35978f","#01665e"],
  "Viridis (dekad)": ["#440154","#414487","#2a788e","#22a884","#7ad151","#fde725"],
  "YlGn (yield)": ["#ffffe5","#f7fcb9","#d9f0a3","#addd8e","#78c679","#41ab5d","#238443","#005a32"],
  "Greyscale": ["#000000","#ffffff"]
};
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function ramp(stops,t){ t=Math.max(0,Math.min(1,t)); const s=t*(stops.length-1); const i=Math.floor(s), f=s-i;
  const a=hex2rgb(stops[i]), b=hex2rgb(stops[Math.min(i+1,stops.length-1)]);
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f].map(Math.round); }
function gradientCSS(stops){ return "linear-gradient(to right,"+stops.join(",")+")"; }

const map = L.map("map",{preferCanvas:true}).setView([1,38],5);
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                        {maxZoom:19,attribution:"Esri World Imagery"});
osm.addTo(map);
L.control.layers({"OpenStreetMap":osm,"Satellite":sat},null,{position:"topright"}).addTo(map);
const layers = {}; let uid=0; const active=[];

document.getElementById("fi").onchange = async e => { for(const f of e.target.files) await addRaster(f); e.target.value=""; };

async function addRaster(file){
  const buf = await file.arrayBuffer();
  let gr; try{ gr = await parseGeoraster(buf); }catch(err){ alert("Could not read "+file.name+":\n"+err); return; }
  const id = "r"+(uid++); const nb = gr.numberOfRasters;
  const st = {gr, band:0, pal:"RdYlGn (CPI/WRSI)", min:gr.mins[0], max:gr.maxs[0], op:0.85, layer:null};
  layers[id]=st; active.push(id);
  // guess a palette + range from filename
  const fn=file.name.toLowerCase();
  if(fn.includes("planting")||fn.includes("dekad")){st.pal="Viridis (dekad)";}
  else if(fn.includes("wrsi")||fn.includes("cpi")){st.pal="RdYlGn (CPI/WRSI)"; st.min=0; st.max=100;}
  else if(fn.includes("waterlog")||fn.includes("whc")||fn.includes("onsetexcess")){st.pal="Blues (waterlog/WHC)";}
  else if(fn.includes("spi")){st.pal="BrBG (SPI −/+)"; st.min=-2; st.max=2;}
  else if(fn.includes("yield")){st.pal="YlGn (yield)"; st.min=0; st.max=6;}
  buildUI(id,file.name,nb); render(id);
  try{ map.fitBounds([[gr.ymin,gr.xmin],[gr.ymax,gr.xmax]]); }catch(_){}
}

function render(id){
  const st=layers[id]; if(st.layer) map.removeLayer(st.layer);
  const stops=PALS[st.pal], b=st.band, mn=+st.min, mx=+st.max, rng=(mx-mn)||1;
  st.layer = new GeoRasterLayer({ georaster:st.gr, opacity:st.op, resolution:256,
    pixelValuesToColorFn: v => { const x=v[b]; if(x===null||isNaN(x)||x===st.gr.noDataValue) return null;
      const [r,g,bl]=ramp(stops,(x-mn)/rng); return `rgb(${r},${g},${bl})`; } });
  st.layer.addTo(map);
}

function buildUI(id,name,nb){
  const st=layers[id]; const d=document.createElement("div"); d.className="lyr"; d.id="ui"+id;
  const bandOpts=[...Array(nb).keys()].map(i=>`<option value="${i}">band ${i+1}${nb>1?"":""}</option>`).join("");
  const palOpts=Object.keys(PALS).map(p=>`<option${p===st.pal?" selected":""}>${p}</option>`).join("");
  d.innerHTML=`<button class="x" title="remove">✕</button><h3>${name}</h3>
    ${nb>1?`<div class="row"><label>Band</label><select class="bd">${bandOpts}</select></div>`:``}
    <div class="row"><label>Palette</label><select class="pl">${palOpts}</select></div>
    <div class="row"><label>Min</label><input class="mn" type="number" step="any" value="${st.min}"><label style="width:auto">Max</label><input class="mx" type="number" step="any" value="${st.max}"></div>
    <div class="row"><label>Opacity</label><input class="op" type="range" min="0" max="1" step="0.05" value="${st.op}"></div>
    <div class="leg"></div><div class="legval"><span class="lo"></span><span class="hi"></span></div>`;
  document.getElementById("layers").prepend(d);
  const $=s=>d.querySelector(s);
  d.querySelector(".x").onclick=()=>{ if(st.layer)map.removeLayer(st.layer); d.remove(); delete layers[id]; };
  if(nb>1)$(".bd").onchange=e=>{ st.band=+e.target.value; st.min=st.gr.mins[st.band]; st.max=st.gr.maxs[st.band];
    $(".mn").value=st.min; $(".mx").value=st.max; render(id); legend(id,d); };
  $(".pl").onchange=e=>{ st.pal=e.target.value; render(id); legend(id,d); };
  $(".mn").oninput=e=>{ st.min=e.target.value; render(id); legend(id,d); };
  $(".mx").oninput=e=>{ st.max=e.target.value; render(id); legend(id,d); };
  $(".op").oninput=e=>{ st.op=+e.target.value; if(st.layer)st.layer.setOpacity(st.op); };
  legend(id,d);
}
function legend(id,d){ const st=layers[id]; d.querySelector(".leg").style.background=gradientCSS(PALS[st.pal]);
  d.querySelector(".lo").textContent=(+st.min).toLocaleString(); d.querySelector(".hi").textContent=(+st.max).toLocaleString(); }

// click to read the value of the topmost loaded raster at that point
const valBox=document.getElementById("val");
map.on("click", e=>{
  const ids=Object.keys(layers); if(!ids.length){valBox.style.opacity=0;return;}
  const st=layers[ids[ids.length-1]], gr=st.gr;
  const col=Math.floor((e.latlng.lng-gr.xmin)/gr.pixelWidth), row=Math.floor((gr.ymax-e.latlng.lat)/gr.pixelHeight);
  let txt="no data";
  try{ const v=gr.values[st.band][row][col]; if(v!==undefined&&v!==null&&v!==gr.noDataValue&&!isNaN(v)) txt=(+v).toLocaleString(); }catch(_){}
  valBox.textContent=`band ${st.band+1}: ${txt}`; valBox.style.opacity=1;
});
</script>
</body>
</html>
